<!--
  TEMPLATE C — ACTION BRANDED (estilo Montaña Dorada con slogan rotativo)

  Variables a reemplazar:
    {{WIDTH}} {{HEIGHT}} {{LOGO_URL}} {{DISH_URL}} {{DISH_ALT}}
    {{SLOGAN_CURSIVE}}  — "Lo mejor,"    (script cursiva)
    {{SLOGAN_CATEGORY}} — "MARISCOS"     (en mayúsculas, sans condensed bold). Punto final se agrega por CSS.
    {{BOTTOM_TAG}}      — opcional: "@montanadorada" o teléfono

  Características:
    - Escena con acción real de la foto (ya viene capturada en {{DISH_URL}}: guante vertiendo salsa, humo, emplatado, drizzle)
    - Slogan blanco centrado sobre el plato, con jerarquía cursiva + sans bold
    - Logo top-center
-->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:{{WIDTH}}px;height:{{HEIGHT}}px;overflow:hidden;}
  body{
    font-family:'Inter',sans-serif;
    color:#FFFFFF;
    background:#0A0A0A;
  }
  .stage{
    position:relative;
    width:{{WIDTH}}px;
    height:{{HEIGHT}}px;
    overflow:hidden;
    background:#0A0A0A;
  }
  .dish-full{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
    filter:contrast(1.05) saturate(1.08);
  }
  .overlay{
    position:absolute;
    inset:0;
    background:
      linear-gradient(180deg, rgba(10,10,10,0.55) 0%, rgba(10,10,10,0.05) 25%, rgba(10,10,10,0.05) 60%, rgba(10,10,10,0.75) 100%);
    z-index:2;
  }
  .logo{
    position:absolute;
    top:55px;
    left:50%;
    transform:translateX(-50%);
    width:160px;
    height:auto;
    filter:drop-shadow(0 4px 16px rgba(0,0,0,0.75));
    opacity:0.96;
    z-index:10;
  }
  .slogan{
    position:absolute;
    top:48%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    z-index:10;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,0.6));
  }
  .slogan .cursive{
    display:block;
    font-family:'Allura',cursive;
    font-size:82px;
    color:#FFFFFF;
    line-height:1;
    letter-spacing:-0.01em;
    margin-bottom:-8px;
    text-shadow:0 2px 12px rgba(0,0,0,0.45);
  }
  .slogan .category{
    display:block;
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:136px;
    color:#FFFFFF;
    line-height:0.95;
    letter-spacing:0.005em;
    text-transform:uppercase;
    text-shadow:0 3px 18px rgba(0,0,0,0.55);
  }
  .slogan .category::after{
    content:".";
    color:#FFFFFF;
  }
  .bottom-tag{
    position:absolute;
    bottom:55px;
    left:50%;
    transform:translateX(-50%);
    font-family:'Inter',sans-serif;
    font-weight:400;
    font-size:20px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:rgba(245,241,234,0.85);
    text-align:center;
    z-index:10;
    text-shadow:0 2px 10px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>
<div class="stage">
  <img class="dish-full" src="{{DISH_URL}}" alt="{{DISH_ALT}}">
  <div class="overlay"></div>
  <img class="logo" src="{{LOGO_URL}}" alt="Montaña Dorada">
  <div class="slogan">
    <span class="cursive">{{SLOGAN_CURSIVE}}</span>
    <span class="category">{{SLOGAN_CATEGORY}}</span>
  </div>
  <div class="bottom-tag">{{BOTTOM_TAG}}</div>
</div>
</body>
</html>
